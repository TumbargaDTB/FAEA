/* ---------- persistence ---------- */
function useWorkspace() {
  const [data, setData] = useState(emptyState);
  const [loaded, setLoaded] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const timer = useRef(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setData({ ...emptyState, ...JSON.parse(raw) });
    } catch (e) {
      /* no saved data yet */
    }
    setLoaded(true);
  }, []);

  const update = useCallback((fn) => {
    setData((prev) => {
      const next = typeof fn === "function" ? fn(prev) : fn;
      if (timer.current) clearTimeout(timer.current);
      timer.current = setTimeout(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          setSavedAt(new Date());
        } catch (e) {
          console.error("Save failed", e);
        }
      }, 700);
      return next;
    });
  }, []);

  return { data, update, loaded, savedAt };
}

/* ---------- derived helpers ---------- */
const gateAnswered = (issue) => GATES.every((g) => issue.screen && issue.screen[g.key]);
const isEligible = (issue) => GATES.every((g) => issue.screen && issue.screen[g.key] === "yes");

/* Member breadth is derived from the FAEA members an issue touches (tagged in
   Intake), operationalizing the rule that FAEA work must represent the
   broader membership rather than any single member's issue. */
const issueMembers = (issue) => (issue.members || []).map(memberById).filter(Boolean);
const memberSectors = (issue) => {
  const set = new Set();
  issueMembers(issue).forEach((m) => m.sectors.forEach((s) => set.add(s)));
  return [...set];
};
const memberBreadthScore = (issue) => {
  const n = (issue.members || []).length;
  if (n === 0) return 0;
  if (n === 1) return 1;
  if (n === 2) return 2;
  if (n === 3) return 3;
  if (n <= 5) return 4;
  return 5;
};

const isScored = (issue) =>
  SCORE_AXES.every((a) => issue.scores && issue.scores[a.key]) && (issue.members || []).length > 0;
const totalScore = (issue) =>
  SCORE_AXES.reduce((s, a) => s + (issue.scores && issue.scores[a.key] ? issue.scores[a.key] : 0), 0) +
  memberBreadthScore(issue);

function phaseProgress(data) {
  const { issues } = data;
  const screenDone = issues.length
    ? issues.filter(gateAnswered).length / issues.length
    : 0;
  const eligible = issues.filter(isEligible);
  const scoredDone = eligible.length
    ? eligible.filter(isScored).length / eligible.length
    : 0;
  return [
    {
      id: "intake",
      name: "Issue Intake",
      sub: "Candidate barriers, logged with standard and sectors",
      pct: issues.length > 0 ? 1 : 0,
      stat: `${issues.length} candidate${issues.length === 1 ? "" : "s"}`,
    },
    {
      id: "screen",
      name: "Eligibility Screen",
      sub: "Every candidate clears four gates or exits",
      pct: screenDone,
      stat: `${eligible.length} clear of ${issues.length}`,
    },
    {
      id: "priority",
      name: "Prioritization",
      sub: "Score eligible issues on outcome, feasibility, breadth",
      pct: scoredDone,
      stat: `${eligible.filter(isScored).length} of ${eligible.length} scored`,
    },
  ];
}

const Stamp = ({ value, onClick, compact }) => {
  const map = {
    yes: { text: "CLEARS", color: PALETTE.pass },
    no: { text: "FAILS", color: PALETTE.fail },
    unsure: { text: "UNSURE", color: PALETTE.unsure },
  };
  const m = map[value];
  if (!m) return null;
  return (
    <span
      className="stamp"
      onClick={onClick}
      style={{
        color: m.color,
        borderColor: m.color,
        fontSize: compact ? 10 : 11,
      }}
    >
      {m.text}
    </span>
  );
};

/* ---------- exports ---------- */
function download(filename, text, type = "text/plain") {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

/* Wrap the memo markdown in a clean, self-contained HTML document so it opens
   with a double-click in any browser, prints to PDF, and pastes into Word. */
function memoToHtml(md, title) {
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (t) =>
    esc(t)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/_(.+?)_/g, "<em>$1</em>");
  const out = [];
  let inList = false;
  const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
  md.split("\n").forEach((raw) => {
    const line = raw.trimEnd();
    if (!line.trim()) { closeList(); return; }
    if (line.startsWith("### ")) { closeList(); out.push(`<h3>${inline(line.slice(4))}</h3>`); return; }
    if (line.startsWith("## ")) { closeList(); out.push(`<h2>${inline(line.slice(3))}</h2>`); return; }
    if (line.startsWith("# ")) { closeList(); out.push(`<h1>${inline(line.slice(2))}</h1>`); return; }
    if (/^\d+\.\s/.test(line)) { closeList(); out.push(`<p class="num">${inline(line)}</p>`); return; }
    if (line.startsWith("- ")) {
      if (!inList) { out.push("<ul>"); inList = true; }
      out.push(`<li>${inline(line.slice(2))}</li>`);
      return;
    }
    closeList();
    out.push(`<p>${inline(line)}</p>`);
  });
  closeList();
  return `<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(title)}</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; color: #1a1a1a; line-height: 1.55;
         max-width: 7.2in; margin: 0 auto; padding: 48px 32px; background: #fff; }
  h1 { font-size: 25px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 16px; text-transform: uppercase; letter-spacing: .08em; color: #6b5a2e;
       border-bottom: 1px solid #d8d2c4; padding-bottom: 5px; margin: 30px 0 12px; }
  h3 { font-size: 17px; margin: 22px 0 6px; }
  p { margin: 7px 0; }
  p.num { margin: 5px 0 5px 18px; }
  ul { margin: 7px 0; padding-left: 22px; }
  li { margin: 4px 0; }
  strong { color: #000; }
  em { color: #55524a; }
  @media print { body { padding: 0; max-width: none; } h2 { break-after: avoid; } h3 { break-after: avoid; } }
</style></head><body>
${out.join("\n")}
</body></html>`;
}

/* Board/member-facing narrative. Same data as the working memo, but written as
   prose: framing first, scores de-emphasized, declines shown as evidence the
   filter has teeth, and a clear ask at the end. */
const andList = (arr) => {
  if (!arr.length) return "";
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return `${arr[0]} and ${arr[1]}`;
  return `${arr.slice(0, -1).join(", ")}, and ${arr[arr.length - 1]}`;
};

function buildBoardNarrative(data) {
  const eligible = data.issues.filter(isEligible).sort((a, b) => totalScore(b) - totalScore(a));
  const declined = data.issues.filter((i) => gateAnswered(i) && !isEligible(i));
  const L = [];

  L.push("# FAEA Strategic Docket");
  L.push("_A staff recommendation for the coming year — prepared for the board and membership._");
  L.push("");

  L.push("## Purpose");
  const nWord = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
  const cnt = eligible.length <= 10 ? nWord[eligible.length] : String(eligible.length);
  L.push(
    `This document sets out the ${cnt} regulatory ${eligible.length === 1 ? "priority" : "priorities"} ` +
    `FAEA staff recommend the alliance take on in the coming year, the reasoning behind ` +
    `${eligible.length === 1 ? "it" : "each"}, and the issues we examined and deliberately set aside. ` +
    `It is offered for the board's reaction and refinement rather than as a menu to choose from: staff have done ` +
    `the screening work so that the board's time goes to judgment, not generation.`
  );
  L.push("");

  L.push("## How these priorities were chosen");
  L.push(
    "FAEA takes on programmatic work that is representative of the broader membership. We do not take on " +
    "individual member issues unless there is a larger goal relevant to all members. Every candidate was tested " +
    "against four questions, and an issue had to clear all four to be recommended:"
  );
  GATES.forEach((g, n) => L.push(`${n + 1}. **${g.label}** — ${g.q}`));
  L.push("");
  L.push(
    "The filter is deliberately strict. It is what allows FAEA to say yes with conviction, and — just as " +
    "importantly — to decline work that belongs elsewhere without appearing arbitrary."
  );
  L.push("");

  L.push("## The proposed docket");
  if (!eligible.length) {
    L.push("_No priorities have cleared the filter yet._");
  } else {
    eligible.forEach((i, n) => {
      const mem = issueMembers(i);
      L.push(`### ${n + 1}. ${i.name || "Unnamed priority"}`);

      // Opening: what and where
      let open = i.description ? i.description.trim() : "";
      if (open && !/[.!?]$/.test(open)) open += ".";
      const where = i.geography ? ` in ${i.geography}` : "";
      const std = i.standard ? `deviation from ${i.standard}` : "a deviation from international standards";
      const isProcess = (i.barrierType || "").startsWith("Process");
      const isBoth = i.barrierType === "Both";
      const frame = isProcess
        ? `Here the international standard is not in dispute; the barrier is in how it is administered — the process, procedure, or enforcement departing from international norms (a WTO SPS Annex C concern).`
        : isBoth
        ? `Both the measure and its administration are at issue.`
        : "";
      L.push(
        `**What it is.** The barrier${where} stems from ${std}.` + (open ? ` ${open}` : "") + (frame ? ` ${frame}` : "")
      );

      // Who it affects
      if (mem.length) {
        const sect = i.sectors && i.sectors.length ? i.sectors.map((s) => s.toLowerCase()) : [];
        L.push(
          `**Who it affects.** ${sect.length ? `This reaches ${andList(sect)}, and touches ` : "This touches "}` +
          `${mem.length} of FAEA's ${MEMBERS.length} members — ${andList(mem.map((m) => m.name))}.`
        );
      }

      // Why FAEA
      if (i.screen && i.screen.notes && i.screen.notes.trim()) {
        let note = i.screen.notes.trim();
        if (!/[.!?]$/.test(note)) note += ".";
        L.push(`**Why FAEA.** ${note}`);
      }

      // Why now — the cost of not acting
      if ((i.inactionRisks && i.inactionRisks.length) || (i.inactionNote && i.inactionNote.trim())) {
        const risks = (i.inactionRisks || []).map((r) => r.split(" — ")[0].toLowerCase());
        let why = "";
        if (risks.length) why += `The cost of staying out: ${andList(risks)}. `;
        if (i.inactionNote && i.inactionNote.trim()) {
          let nt = i.inactionNote.trim();
          if (!/[.!?]$/.test(nt)) nt += ".";
          why += nt;
        }
        L.push(`**Why now.** ${why.trim()}`);
      }

      // Member input (from the survey)
      const mi = [];
      if (i.successMetric && i.successMetric.trim()) mi.push(`members define success as ${i.successMetric.trim().replace(/[.]$/, "")}`);
      if (i.mechanism) mi.push(`the preferred approach is ${i.mechanism.toLowerCase()}`);
      if (mi.length) {
        const lead = i.memberRank ? `Members rank this a ${i.memberRank.toLowerCase()} priority; ` : "";
        L.push(`**What members told us.** ${lead}${mi.join("; ")}.`);
      } else if (i.memberRank) {
        L.push(`**What members told us.** Members rank this a ${i.memberRank.toLowerCase()} priority.`);
      }

      L.push(
        `**Staff assessment.** Ranked ${n + 1} of ${eligible.length} on outcome potential, feasibility, ` +
        `complementarity with existing efforts, and breadth across the membership.`
      );
      L.push("");
    });
  }

  L.push("## What this docket covers across the membership");
  const served = new Set();
  eligible.forEach((i) => (i.members || []).forEach((m) => served.add(m)));
  if (served.size) {
    L.push(
      `Taken together, these priorities serve ${served.size} of FAEA's ${MEMBERS.length} members. ` +
      `The table below shows where each member's interests appear in the docket.`
    );
    L.push("");
    MEMBERS.forEach((m) => {
      const hit = eligible.filter((i) => (i.members || []).includes(m.id));
      L.push(
        hit.length
          ? `- **${m.name}** — ${andList(hit.map((i) => i.name || "unnamed priority"))}`
          : `- **${m.name}** — not directly addressed in this docket`
      );
    });
    const untouched = MEMBERS.filter((m) => !served.has(m.id));
    if (untouched.length) {
      L.push("");
      L.push(
        `Staff note that ${andList(untouched.map((m) => m.short))} ${untouched.length === 1 ? "is" : "are"} ` +
        `not directly served by this docket. That is a deliberate consequence of the breadth test rather than an ` +
        `oversight, and it is a reasonable subject for board discussion.`
      );
    }
  } else {
    L.push("_No members have been mapped to docket priorities yet._");
  }
  L.push("");

  L.push("## Considered and set aside");
  if (declined.length) {
    L.push(
      `Staff examined ${data.issues.length} candidate ${data.issues.length === 1 ? "barrier" : "barriers"} in total. ` +
      `The following did not clear the filter. Several are real and costly problems for individual members — ` +
      `they simply are not work that a coalition of this kind is the right vehicle to carry.`
    );
    L.push("");
    declined.forEach((i) => {
      const failed = GATES.filter((g) => i.screen[g.key] === "no").map((g) => g.label);
      const unsure = GATES.filter((g) => i.screen[g.key] === "unsure").map((g) => g.label);
      let reason = "";
      if (failed.length) reason = `Does not meet the ${andList(failed)} test${failed.length > 1 ? "s" : ""}.`;
      else if (unsure.length) reason = `Unresolved on ${andList(unsure)}.`;
      const note = i.screen && i.screen.notes ? ` ${i.screen.notes.trim()}` : "";
      L.push(`- **${i.name || "Unnamed"}**${i.geography ? ` (${i.geography})` : ""} — ${reason}${note}`);
    });
  } else {
    L.push("_Every candidate screened so far has cleared the filter._");
  }
  L.push("");

  L.push("## What we are asking of the board");
  L.push(
    "Staff are not asking the board to generate priorities. We are asking for three things: " +
    "confirmation that the filter reflects the board's understanding of FAEA's mandate; reaction to the " +
    "priorities as ranked, including anything the board believes is mis-weighted; and a view on whether the " +
    "members not directly served by this docket represent a gap worth correcting."
  );

  return L.join("\n");
}

function buildBoardMemo(data) {
  const eligible = data.issues
    .filter(isEligible)
    .sort((a, b) => totalScore(b) - totalScore(a));
  const lines = [];
  lines.push("# FAEA Strategic Docket — Framing Memo");
  lines.push("");
  lines.push("## Eligibility filter");
  lines.push("An issue enters the FAEA docket only if it clears all four gates:");
  GATES.forEach((g, i) => lines.push(`${i + 1}. **${g.label}.** ${g.q}`));
  lines.push("");
  lines.push("## Ranked docket");
  if (eligible.length) {
    eligible.forEach((i, n) => {
      lines.push(`### ${n + 1}. ${i.name || "Unnamed barrier"}`);
      if (i.geography) lines.push(`**Geography:** ${i.geography}`);
      if (i.standard) lines.push(`**Standard at issue:** ${i.standard}`);
      if (i.barrierType) lines.push(`**Barrier type:** ${i.barrierType}`);
      if (i.sectors && i.sectors.length) lines.push(`**Sectors affected:** ${i.sectors.join(", ")}`);
      const mem = issueMembers(i);
      if (mem.length) lines.push(`**Members served:** ${mem.map((m) => m.short).join(", ")} (${mem.length} of ${MEMBERS.length})`);
      lines.push(`**Priority score:** ${totalScore(i)} / 20`);
      if (i.description) lines.push(`**Issue:** ${i.description}`);
      if (i.screen && i.screen.notes) lines.push(`**Screen notes:** ${i.screen.notes}`);
      lines.push("");
    });
  } else lines.push("_Nothing has cleared the filter yet._");
  lines.push("");
  lines.push("## Membership representation");
  const served = new Set();
  eligible.forEach((i) => (i.members || []).forEach((m) => served.add(m)));
  if (served.size) {
    lines.push(`This docket touches ${served.size} of ${MEMBERS.length} FAEA members:`);
    MEMBERS.forEach((m) => {
      const hit = eligible.filter((i) => (i.members || []).includes(m.id));
      if (hit.length) lines.push(`- **${m.short}** — ${hit.map((i) => i.name || "Unnamed").join("; ")}`);
    });
    const untouched = MEMBERS.filter((m) => !served.has(m.id));
    if (untouched.length) lines.push(`- _Not yet represented: ${untouched.map((m) => m.short).join(", ")}_`);
  } else lines.push("_No members tagged on eligible issues yet._");
  lines.push("");
  lines.push(`_Issues screened: ${data.issues.length} · Cleared filter: ${eligible.length}_`);
  return lines.join("\n");
}

/* ============================================================ */
function FAEAWorkspace() {
  const { data, update, loaded, savedAt } = useWorkspace();
  const [view, setView] = useState("dashboard");
  const [importErr, setImportErr] = useState("");
  const [copied, setCopied] = useState(false);
  const fileRef = useRef(null);

  const phases = useMemo(() => phaseProgress(data), [data]);
  const overall = phases.reduce((s, p) => s + p.pct, 0) / phases.length;
  const eligible = data.issues.filter(isEligible);

  /* ------- mutators ------- */
  const addIssue = () =>
    update((d) => ({
      ...d,
      issues: [
        ...d.issues,
        { id: uid(), name: "", geography: "", standard: "", barrierType: "", members: [], sectors: [], description: "", inactionRisks: [], inactionNote: "", memberRank: "", successMetric: "", mechanism: "", screen: {}, scores: {} },
      ],
    }));
  const editIssue = (id, patch) =>
    update((d) => ({
      ...d,
      issues: d.issues.map((i) => (i.id === id ? { ...i, ...patch } : i)),
    }));
  const delIssue = (id) =>
    update((d) => ({ ...d, issues: d.issues.filter((i) => i.id !== id) }));
  const toggleSector = (issue, s) => {
    const has = issue.sectors.includes(s);
    editIssue(issue.id, { sectors: has ? issue.sectors.filter((x) => x !== s) : [...issue.sectors, s] });
  };
  const toggleMember = (issue, id) => {
    const cur = issue.members || [];
    const has = cur.includes(id);
    editIssue(issue.id, { members: has ? cur.filter((x) => x !== id) : [...cur, id] });
  };
  const toggleInactionRisk = (issue, r) => {
    const cur = issue.inactionRisks || [];
    const has = cur.includes(r);
    editIssue(issue.id, { inactionRisks: has ? cur.filter((x) => x !== r) : [...cur, r] });
  };
  const setGate = (issue, key, v) =>
    editIssue(issue.id, { screen: { ...issue.screen, [key]: v } });
  const setScore = (issue, key, v) =>
    editIssue(issue.id, { scores: { ...issue.scores, [key]: v } });

  const doImport = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(r.result);
        update({ ...emptyState, ...parsed });
        setImportErr("");
      } catch {
        setImportErr("That file isn't a valid workspace backup.");
      }
    };
    r.readAsText(file);
  };

  /* ---- feed tray: ingest a feed file, triage items into Intake (never auto-docket) ---- */
  const feedRef = useRef(null);
  const [feedErr, setFeedErr] = useState("");
  const importFeed = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(r.result);
        const items = Array.isArray(parsed) ? parsed : parsed.feed || [];
        if (!Array.isArray(items)) throw new Error();
        // normalize + de-dupe against existing feed by url/title
        update((d) => {
          const seen = new Set((d.feed || []).map((f) => f.url || f.title));
          const add = items
            .filter((it) => it && (it.title || it.url) && !seen.has(it.url || it.title))
            .map((it) => ({
              id: uid(),
              title: it.title || "Untitled report",
              source: it.source || "GAIN",
              date: it.date || "",
              country: it.country || "",
              url: it.url || "",
              sectors: Array.isArray(it.sectors) ? it.sectors.filter((s) => SECTORS.includes(s)) : [],
            }));
          return { ...d, feed: [...add, ...(d.feed || [])] };
        });
        setFeedErr("");
      } catch {
        setFeedErr("That file isn't a valid feed (expected a JSON array of items).");
      }
    };
    r.readAsText(file);
  };
  const dismissFeed = (id) =>
    update((d) => ({ ...d, feed: (d.feed || []).filter((f) => f.id !== id) }));
  const feedToIntake = (item) =>
    update((d) => ({
      ...d,
      issues: [
        ...d.issues,
        {
          id: uid(), name: item.title || "", geography: item.country || "", standard: "", barrierType: "",
          members: [], sectors: item.sectors || [], description: item.url ? `From ${item.source || "GAIN"} (${item.date || "n.d."}): ${item.url}` : "",
          inactionRisks: [], inactionNote: "", memberRank: "", successMetric: "", mechanism: "", screen: {}, scores: {},
        },
      ],
      feed: (d.feed || []).filter((f) => f.id !== item.id),
    }));
    return (
      <div style={{ background: PALETTE.paper, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: PALETTE.mute, fontFamily: "Archivo, sans-serif" }}>
        Loading workspace…
      </div>
    );

  /* ------- shared header ------- */
  const Header = ({ title, sub }) => (
    <div className="ph-head">
      <button className="back" onClick={() => setView("dashboard")}>← Dashboard</button>
      <h2 className="ph-title">{title}</h2>
      {sub && <p className="ph-sub">{sub}</p>}
    </div>
  );

  /* ------- views ------- */
  const Dashboard = (
    <>
      <div className="masthead">
        <div className="eyebrow">FAEA · Strategic Docket Builder</div>
        <h1 className="h1">From everything worth doing<br />to the work only FAEA can do.</h1>
        <p className="lede">
          A staff-driven pipeline: log candidate issues, run the four-gate
          filter, score what survives, and hand the board a docket to react
          to — not generate.
        </p>
      </div>

      <div className="progress-card">
        <div className="big-num">{Math.round(overall * 100)}<span className="pct-sign">%</span></div>
        <div className="big-label">Pipeline complete</div>
        <Bar pct={overall} height={8} />
        <div className="prog-stats">
          <span>{data.issues.length} candidates</span>
          <span>{eligible.length} clear the filter</span>
          <span>{eligible.filter(isScored).length} scored</span>
        </div>
      </div>

      <div className="section-label">Phases</div>
      {phases.map((p, n) => (
        <button key={p.id} className="phase-card" onClick={() => setView(p.id)}>
          <div className="phase-num">{String(n + 1).padStart(2, "0")}</div>
          <div className="phase-body">
            <div className="phase-name">{p.name}</div>
            <div className="phase-sub">{p.sub}</div>
            <Bar pct={p.pct} />
            <div className="phase-stat">{p.stat} · {Math.round(p.pct * 100)}%</div>
          </div>
          <div className="phase-go">→</div>
        </button>
      ))}

      <div className="section-label">Reference</div>
      <button className="phase-card" onClick={() => setView("convergence")}>
        <div className="phase-num">◇</div>
        <div className="phase-body">
          <div className="phase-name">Convergence</div>
          <div className="phase-sub">Where member priorities stack up — the cross-cutting program candidates</div>
        </div>
        <div className="phase-go">→</div>
      </button>
      <button className="phase-card" onClick={() => setView("standards")}>
        <div className="phase-num">◷</div>
        <div className="phase-body">
          <div className="phase-name">Standards Watch</div>
          <div className="phase-sub">Codex sessions & WTO notifications — shape the standard before it becomes a barrier</div>
        </div>
        <div className="phase-go">→</div>
      </button>
      <button className="phase-card" onClick={() => setView("feed")}>
        <div className="phase-num">⊕</div>
        <div className="phase-body">
          <div className="phase-name">New &amp; unverified{(data.feed || []).length > 0 ? ` · ${data.feed.length}` : ""}</div>
          <div className="phase-sub">Feed inbox — GAIN reports and notifications, parked for triage into Intake</div>
        </div>
        <div className="phase-go">→</div>
      </button>
      <button className="phase-card" onClick={() => setView("members")}>
        <div className="phase-num">★</div>
        <div className="phase-body">
          <div className="phase-name">FAEA Membership</div>
          <div className="phase-sub">The 10 members, their interests, and the shared threads a representative docket should serve</div>
        </div>
        <div className="phase-go">→</div>
      </button>

      <div className="section-label">Outputs</div>
      <div className="btn-row">
        <button className="btn primary" onClick={() =>
          download("FAEA-board-narrative.html", memoToHtml(buildBoardNarrative(data), "FAEA Strategic Docket"), "text/html")}>
          Export board narrative
        </button>
        <button className="btn" onClick={() =>
          download("FAEA-board-memo.html", memoToHtml(buildBoardMemo(data), "FAEA Strategic Docket — Framing Memo"), "text/html")}>
          Export working memo
        </button>
        <button className="btn" onClick={async () => {
          try {
            await navigator.clipboard.writeText(buildBoardMemo(data));
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          } catch (e) { setCopied(false); }
        }}>
          {copied ? "✓ Copied" : "Copy memo text"}
        </button>
        <button className="btn" onClick={() => download("faea-workspace-backup.json", JSON.stringify(data, null, 2), "application/json")}>
          Export JSON backup
        </button>
        <button className="btn" onClick={() => fileRef.current && fileRef.current.click()}>Import backup</button>
        <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }}
          onChange={(e) => e.target.files[0] && doImport(e.target.files[0])} />
      </div>
      {importErr && <div className="err">{importErr}</div>}
      <div className="save-note">
        <strong>Board narrative</strong> is the descriptive, member-facing version — prose framing,
        each priority explained, and the issues you declined. <strong>Working memo</strong> is the
        internal version with scores and field labels. Both download as formatted documents:
        double-click to open in your browser, then print to PDF or paste into Word.
        {savedAt && ` Last saved ${savedAt.toLocaleTimeString()}.`}
      </div>
    </>
  );

  const Intake = (
    <>
      <Header title="Issue Intake" sub="Log every candidate barrier without judging it yet. The filter does the judging in the next phase." />
      <div className="form-intro">
        <strong>How to use this phase.</strong> Add one card per barrier and fill in what you know —
        don't worry yet about whether it belongs on the docket; that's what the Eligibility Screen is for.
        Anything left blank can be filled in later. The Description and the tags you set here become the
        body of the exported board narrative, so a little care now saves rewriting at the end.
      </div>
      {data.issues.map((i) => (
        <div key={i.id} className="card">
          <Field label="Barrier name"
            help="A short, specific title naming the measure and what it does — e.g. 'Import MRLs set below Codex levels for soybeans'. Leave the country out; that goes in Geography.">
            <input className="inp" value={i.name} placeholder="e.g. Import MRLs below Codex levels for soybeans"
              onChange={(e) => editIssue(i.id, { name: e.target.value })} />
          </Field>
          <Field label="Geography"
            help="The country, region, or trade bloc where the barrier applies. List several if it spans markets.">
            <input className="inp" value={i.geography} placeholder="e.g. Indonesia and other ART partners"
              onChange={(e) => editIssue(i.id, { geography: e.target.value })} />
          </Field>
          <Field label="International standard at issue"
            help="Which international standard is the hook. Codex = food safety, MRLs, additives · WOAH = animal health · IPPC = plant health · WTO SPS = transparency & process (the hook for undue-delay and procedural barriers). Choose 'Other · multiple' if it spans several.">
            <select className="inp" value={i.standard} onChange={(e) => editIssue(i.id, { standard: e.target.value })}>
              <option value="">Select…</option>
              {STANDARDS.map((s) => <option key={s}>{s}</option>)}
            </select>
          </Field>
          <Field label="Barrier type"
            help="Is the problem the measure itself, or how it's run? A rule can be fully Codex/WOAH/IPPC-aligned and still block trade through slow, opaque, or duplicative administration — those process barriers hook to WTO SPS Annex C (undue delay, procedure) and are often the best fit for FAEA's capacity-building model.">
            <select className="inp" value={i.barrierType || ""} onChange={(e) => editIssue(i.id, { barrierType: e.target.value })}>
              <option value="">Select…</option>
              {BARRIER_TYPES.map((b) => <option key={b}>{b}</option>)}
            </select>
          </Field>
          <Field label="Sectors affected"
            help="Tap every FAEA sector the barrier touches. Two or more is a signal the cross-sector gate will clear in the next phase.">
            <div className="chip-wrap">
              {SECTORS.map((s) => (
                <button key={s} className={`chip ${i.sectors.includes(s) ? "chip-on" : ""}`}
                  onClick={() => toggleSector(i, s)}>{s}</button>
              ))}
            </div>
          </Field>
          <Field label="FAEA members affected"
            help="Tap each member whose exports this barrier genuinely hits. This drives the automatic member-breadth score — be inclusive but honest; don't tag a member the barrier doesn't really touch.">
            <div className="chip-wrap">
              {MEMBERS.map((m) => (
                <button key={m.id} className={`chip ${(i.members || []).includes(m.id) ? "chip-on" : ""}`}
                  title={m.name} onClick={() => toggleMember(i, m.id)}>{m.short}</button>
              ))}
            </div>
            {(i.members || []).length > 0 && (
              <div className="member-hint">
                Touches {(i.members || []).length} of {MEMBERS.length} members · sectors: {memberSectors(i).join(", ") || "—"}
              </div>
            )}
          </Field>
          <Field label="Description"
            help="A few plain sentences a board member could read cold: what the measure requires, how it blocks trade, and what FAEA's collaborative role would be. This becomes the body text in the board narrative.">
            <textarea className="inp ta" rows={3} value={i.description}
              placeholder="What the barrier requires, how it blocks trade, and where FAEA's collaborative role fits"
              onChange={(e) => editIssue(i.id, { description: e.target.value })} />
          </Field>
          <div className="survey-band">Stakes — the cost of not acting</div>
          <Field label="Risk if FAEA doesn't engage"
            help="What happens if FAEA stays out of this market. A barrier a competitor is exploiting, or one that could spread to other markets, is more urgent than breadth alone shows — this is the 'why now' the board narrative needs.">
            <div className="chip-wrap">
              {INACTION_RISKS.map((r) => (
                <button key={r} className={`chip ${(i.inactionRisks || []).includes(r) ? "chip-on" : ""}`}
                  onClick={() => toggleInactionRisk(i, r)}>{r}</button>
              ))}
            </div>
          </Field>
          <Field label="What's at stake / who's moving"
            help="Name the competitor or the contagion path: which exporter is gaining while the U.S. is blocked, what export value is exposed, or which markets could copy the measure.">
            <textarea className="inp ta" rows={2} value={i.inactionNote || ""}
              placeholder="e.g. Australia is taking share under its own beef access while U.S. plants stay delisted; measure mirrors an EU rule others may adopt"
              onChange={(e) => editIssue(i.id, { inactionNote: e.target.value })} />
          </Field>
          <div className="survey-band">Member input — from the survey</div>
          <Field label="Member priority level"
            help="How the affected members rank this barrier among their own priorities (from the survey). Public priority ≠ internal priority — this is what should weight Outcome potential in scoring.">
            <select className="inp" value={i.memberRank || ""} onChange={(e) => editIssue(i.id, { memberRank: e.target.value })}>
              <option value="">Not yet surveyed…</option>
              {MEMBER_RANK.map((r) => <option key={r}>{r}</option>)}
            </select>
          </Field>
          <Field label="What success looks like (12–24 months)"
            help="The outcome the members would call a win — scoped and time-bound, not a topic. Turns a barrier into a program and sharpens the Outcome and Feasibility scores.">
            <textarea className="inp ta" rows={2} value={i.successMetric || ""}
              placeholder="e.g. Partner recognizes U.S. ractopamine-free certification within 18 months"
              onChange={(e) => editIssue(i.id, { successMetric: e.target.value })} />
          </Field>
          <Field label="Preferred mechanism"
            help="How members would want FAEA to act. Capacity-building and standards-body work fit FAEA's model best; if members want pure enforcement, that's a signal it belongs in USTR's lane.">
            <select className="inp" value={i.mechanism || ""} onChange={(e) => editIssue(i.id, { mechanism: e.target.value })}>
              <option value="">Not yet surveyed…</option>
              {MECHANISMS.map((m) => <option key={m}>{m}</option>)}
            </select>
          </Field>
          <button className="link-del" onClick={() => delIssue(i.id)}>Remove</button>
        </div>
      ))}
      <button className="btn primary" onClick={addIssue}>+ Add candidate barrier</button>
    </>
  );

  const Screen = (
    <>
      <Header title="Eligibility Screen" sub="Four gates. An issue joins the docket pipeline only if it clears all four — the filter is the mandate." />
      <div className="form-intro">
        For each barrier, answer all four gates. <strong>Clears</strong> = yes, it passes ·
        <strong> Fails</strong> = no, it doesn't · <strong>Unsure</strong> = you need more input before deciding.
        An issue advances to scoring only when all four Clear; a single Fail or Unsure holds it out — which is
        the filter working, not a problem to fix.
      </div>
      {data.issues.length === 0 && <div className="empty">No candidates yet. Add barriers in Issue Intake first.</div>}
      {data.issues.map((i) => {
        const done = gateAnswered(i);
        const clear = isEligible(i);
        return (
          <div key={i.id} className="card">
            <div className="card-title-row">
              <div className="card-title">{i.name || "Unnamed barrier"}</div>
              {done && (
                <span className="stamp big-stamp" style={{
                  color: clear ? PALETTE.pass : PALETTE.fail,
                  borderColor: clear ? PALETTE.pass : PALETTE.fail,
                }}>
                  {clear ? "CLEARS FILTER" : "EXITS PIPELINE"}
                </span>
              )}
            </div>
            {GATES.map((g) => (
              <div key={g.key} className="gate">
                <div className="gate-q"><strong>{g.label}.</strong> {g.q}</div>
                <div className="gate-btns">
                  {["yes", "no", "unsure"].map((v) => (
                    <button key={v}
                      className={`gate-btn ${i.screen[g.key] === v ? "gate-on" : ""}`}
                      style={i.screen[g.key] === v ? {
                        borderColor: v === "yes" ? PALETTE.pass : v === "no" ? PALETTE.fail : PALETTE.unsure,
                        color: v === "yes" ? PALETTE.pass : v === "no" ? PALETTE.fail : PALETTE.unsure,
                      } : {}}
                      onClick={() => setGate(i, g.key, v)}>
                      {v === "yes" ? "Clears" : v === "no" ? "Fails" : "Unsure"}
                    </button>
                  ))}
                </div>
                {g.key === "complement" && (
                  <>
                    {issueMembers(i).length > 0 && (
                      <div className="fas-check">
                        <div className="fas-check-label">Tagged members' existing FAS channel — is the barrier already covered here?</div>
                        {issueMembers(i).map((m) => (
                          <div key={m.id} className="fas-row"><span className="fas-who">{m.short}</span> — {m.fas}</div>
                        ))}
                      </div>
                    )}
                    {(() => {
                      const groups = [...new Set((i.sectors || []).flatMap((s) => NONMEMBER_BY_SECTOR[s] || []))].sort();
                      return groups.length ? (
                        <div className="fas-check nonmember">
                          <div className="fas-check-label">Non-member groups in these sectors — check for overlap</div>
                          <div className="nonmember-list">{groups.join(" · ")}</div>
                          <div className="nonmember-note">These hold their own FAS market-development funds and may already cover this product or issue. If one does, that's a Fails or Unsure.</div>
                        </div>
                      ) : (
                        <div className="fas-check nonmember">
                          <div className="fas-check-label">Non-member groups</div>
                          <div className="nonmember-note">Tag this issue's sectors to see which non-member associations to check for overlap.</div>
                        </div>
                      );
                    })()}
                    <details className="whos-here">
                      <summary>Who's already here? — check before you answer</summary>
                      <div className="wh-body">
                        {FIELD_MAP.map((grp) => (
                          <div key={grp.group} className="wh-group">
                            <div className="wh-group-label">{grp.group}</div>
                            {grp.items.map((it, n) => (
                              <div key={n} className="wh-item"><span className="wh-who">{it.who}</span> — {it.note}</div>
                            ))}
                          </div>
                        ))}
                        <div className="wh-foot">
                          If another FAS-funded group is already on this — a single member's own program, or a
                          non-member association covering the same product or issue — that's a Fails or Unsure here.
                          The government rows are FAEA's funding rails and machinery to direct, not duplicators. FAEA's
                          lane is coordinating across the membership so MAP fills the gaps other programs leave.
                        </div>
                      </div>
                    </details>
                  </>
                )}
              </div>
            ))}
            <Field label="Screen notes"
              help="Evidence for your answers, caveats, and who to consult. If you marked anything Unsure, note what would resolve it. This text carries into the board narrative's decline reasons.">
              <textarea className="inp ta" rows={2} value={i.screen.notes || ""}
                onChange={(e) => setGate(i, "notes", e.target.value)} />
            </Field>
          </div>
        );
      })}
    </>

  const Priority = (
    <>
      <Header title="Prioritization" sub="Score the three judgment axes 1–5; member breadth is scored automatically from the members you tagged in Intake. The ranking writes itself." />

      {[...eligible].sort((a, b) => totalScore(b) - totalScore(a)).map((i) => (

          <div className="card-title-row">

            <div className="score-total">{totalScore(i)}<span className="score-den">/20</span></div>
          </div>

            <div key={a.key} className="axis">
              <div className="axis-l">{a.label}<span className="axis-hint"> — {a.hint}</span></div>

                {[1, 2, 3, 4, 5].map((n) => (

              </div>
            </div>
          ))}

            <div className="axis-l">Member breadth<span className="axis-hint"> — auto-scored from the members tagged in Intake</span></div>

              </div>

  const Feed = (
    <>

      <div className="form-intro">

          onChange={(e) => e.target.files[0] && importFeed(e.target.files[0])} />
        {(data.feed || []).length > 0 && <span className="save-note" style={{ alignSelf: "center" }}>{data.feed.length} item{data.feed.length === 1 ? "" : "s"} waiting</span>}
      </div>
      {feedErr && <div className="err">{feedErr}</div>}
      {(data.feed || []).length === 0 ? (
        <div className="empty">No feed items. Generate a feed file with the FAS fetcher script and import it here — or wire the serverless proxy to populate this automatically.</div>

            <div className="feed-meta">
              <span className="std-tag">{f.source}</span>
              {f.country && <span className="feed-country">{f.country}</span>}
              {f.date && <span className="feed-date">{f.date}</span>}
              {f.sectors && f.sectors.length > 0 && <span className="feed-sectors">{f.sectors.join(" · ")}</span>}

            <div className="feed-actions">
              <button className="btn primary" onClick={() => feedToIntake(f)}>Send to Intake</button>
              <button className="btn" onClick={() => dismissFeed(f.id)}>Dismiss</button>
            </div>
          </div>
        ))
      )}
    </>

  const Standards = (
    <>
      <Header title="Standards Watch" sub="The upstream lane — Codex sessions and WTO notifications where tomorrow's MRL and certification barriers are being decided now. Shaping the standard beats fighting the barrier market-by-market." />
      <div className="form-intro">
        This is FAEA's get-ahead-of-it play. Each Codex session below has a U.S. public-comment on-ramp; the WTO feed is the live early-warning stream. Where the U.S. position already matches what FAEA would want, the move is coordinated member support — not opposition.
      </div>
      <div className="section-label">Codex — upcoming</div>
      {STANDARDS_WATCH.filter((s) => s.status === "upcoming").map((s) => (
        <div key={s.body} className="cluster">

            <div className="std-when">{s.date}{s.place !== "—" ? ` · ${s.place}` : ""}</div>
          </div>

      <div className="section-label">Codex — concluded this cycle</div>

        <div className="std-tag" style={{ marginBottom: 4 }}>Watch for</div>
        {WTO_WATCH.watch.map((w, n) => <div key={n} className="wh-item">• {w}</div>)}
      </div>
    </>
  );

  const Convergence = (() => {
    const issues = data.issues;
    const distinct = (list) => new Set(list.flatMap((i) => i.members || []));
    const groupBy = (keyFn) => {
      const map = {};
      issues.forEach((i) => { const k = keyFn(i); if (!k) return; (map[k] = map[k] || []).push(i); });
      return Object.entries(map).sort((a, b) => distinct(b[1]).size - distinct(a[1]).size);
    };
    const clusterCard = (label, list) => {
      const mem = [...distinct(list)];
      const elig = list.filter(isEligible).length;
      return (
        <div key={label} className="cluster">
          <div className="cluster-head">
            <div className="cluster-label">{label}</div>
            <div className="cluster-count">{mem.length}<span className="cluster-den">/{MEMBERS.length}</span></div>
          </div>
          <div className="cluster-meta">
            {list.length} barrier{list.length === 1 ? "" : "s"} · {elig} clear the filter
            {mem.length >= 5 && <span className="cluster-badge">coalition-scale</span>}
          </div>
          <div className="cluster-members">
            {mem.map((id) => { const m = memberById(id); return m ? <span key={id} className="mem-tag">{m.short}</span> : null; })}
          </div>
          <div className="cluster-issues">{list.map((i) => i.name || "Unnamed barrier").join(" · ")}</div>
        </div>
      );
    };

    const byStandard = groupBy((i) => i.standard);
    const byType = groupBy((i) => i.barrierType);
    const memberRep = MEMBERS
      .map((m) => ({ m, n: issues.filter((i) => (i.members || []).includes(m.id)).length }))
      .sort((a, b) => b.n - a.n);
    const maxRep = Math.max(1, ...memberRep.map((r) => r.n));
    const allMembers = distinct(issues).size;

    return (
      <>
        <Header title="Convergence" sub="Where members' priorities stack up on the same problem. A barrier several members independently flag is coalition-scale by construction — these are the clearest program candidates." />
        {issues.length === 0 ? (
          <div className="empty">No candidates logged yet. Add barriers in Issue Intake and tag their members, standard, and barrier type — the clusters build here automatically.</div>
        ) : (
          <>
            <div className="conv-summary">
              {issues.length} candidate{issues.length === 1 ? "" : "s"} · touching {allMembers} of {MEMBERS.length} members · {issues.filter(isEligible).length} clear the filter
            </div>

            <div className="section-label">By international standard</div>
            {byStandard.length
              ? byStandard.map(([k, list]) => clusterCard(k, list))
              : <div className="empty">Tag issues with a standard to see convergence here.</div>}

            <div className="section-label">By barrier type</div>
            {byType.length
              ? byType.map(([k, list]) => clusterCard(k, list))
              : <div className="empty">Tag issues with a barrier type — the process/administration cluster is often the broadest.</div>}

            <div className="section-label">Member representation</div>
            <div className="card">
              <p className="ph-sub" style={{ marginBottom: 10 }}>
                How many candidates touch each member. The zeros are the representation gaps a board should notice before signing off.
              </p>
              {memberRep.map(({ m, n }) => (
                <div key={m.id} className="rep-row">
                  <span className="rep-name">{m.short}</span>
                  <span className="rep-bar-wrap"><span className="rep-bar" style={{ width: `${(n / maxRep) * 100}%` }} /></span>
                  <span className="rep-n">{n}</span>
                </div>
              ))}
            </div>
          </>
        )}
      </>
    );
  })();

  const Members = (
    <>

      <div className="section-label">Members · {MEMBERS.length}</div>

            <div className="mem-short">{m.short}</div>

            {m.sectors.map((s) => <span key={s} className="mem-tag">{s}</span>)}

          <div className="mem-interests">{m.interests}</div>
          <div className="mem-fas"><span className="mem-fas-label">FAS channel:</span> {m.fas}</div>

      <div className="card">
        <p className="ph-sub" style={{ marginBottom: 6 }}>

        .form-intro strong { color: ${PALETTE.field}; }
        .whos-here { margin: 10px 0 2px; border: 1px solid ${PALETTE.line}; border-radius: 8px; background: ${PALETTE.paper}; }
        .whos-here > summary { cursor: pointer; padding: 8px 12px; font-family: 'IBM Plex Mono', monospace;
          font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: ${PALETTE.field}; list-style: none; }
        .whos-here > summary::-webkit-details-marker { display: none; }
        .whos-here > summary::before { content: "▸ "; color: ${PALETTE.wheat}; }
        .whos-here[open] > summary::before { content: "▾ "; }
        .wh-body { padding: 2px 12px 12px; }
        .wh-group { margin-top: 10px; }
        .wh-group-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .06em;
          text-transform: uppercase; color: ${PALETTE.mute}; margin-bottom: 4px; }
        .wh-item { font-size: 12.5px; line-height: 1.45; color: ${PALETTE.ink}; margin: 3px 0; }
        .wh-who { font-weight: 600; color: ${PALETTE.field}; }
        .wh-foot { margin-top: 12px; font-size: 12px; line-height: 1.5; color: ${PALETTE.mute}; font-style: italic;
          border-top: 1px dashed ${PALETTE.line}; padding-top: 8px; }
        .fas-check { margin: 10px 0 2px; padding: 10px 12px; background: ${PALETTE.wheatSoft};
          border: 1px solid ${PALETTE.line}; border-radius: 8px; }
        .fas-check-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .05em;
          text-transform: uppercase; color: ${PALETTE.field}; margin-bottom: 6px; }
        .fas-row { font-size: 12.5px; line-height: 1.45; color: ${PALETTE.ink}; margin: 3px 0; }
        .fas-who { font-weight: 600; color: ${PALETTE.field}; }
        .nonmember { background: ${PALETTE.paper}; }
        .nonmember-list { font-size: 12.5px; line-height: 1.5; color: ${PALETTE.ink}; margin-bottom: 6px; }
        .nonmember-note { font-size: 12px; line-height: 1.45; color: ${PALETTE.mute}; font-style: italic; }
        .mem-fas { font-size: 12px; line-height: 1.45; color: ${PALETTE.mute}; margin-top: 8px;
          padding-top: 8px; border-top: 1px dashed ${PALETTE.line}; }
        .mem-fas-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .05em;
          text-transform: uppercase; color: ${PALETTE.field}; }
        .survey-band { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .08em;
          text-transform: uppercase; color: ${PALETTE.wheat}; margin: 16px 0 4px; padding-top: 12px;
          border-top: 1px dashed ${PALETTE.line}; }
        .conv-summary { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: ${PALETTE.field};
          background: ${PALETTE.wheatSoft}; border: 1px solid ${PALETTE.line}; border-radius: 8px;
          padding: 10px 12px; margin-bottom: 16px; line-height: 1.5; }
        .cluster { border: 1px solid ${PALETTE.line}; border-radius: 10px; padding: 12px 14px;
          margin-bottom: 10px; background: ${PALETTE.paper}; }
        .cluster-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
        .cluster-label { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; color: ${PALETTE.ink}; }
        .cluster-count { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600;
          color: ${PALETTE.field}; white-space: nowrap; }
        .cluster-den { font-size: 11px; color: ${PALETTE.mute}; }
        .cluster-meta { font-size: 12px; color: ${PALETTE.mute}; margin: 4px 0 8px; }
        .cluster-badge { display: inline-block; margin-left: 8px; font-family: 'IBM Plex Mono', monospace;
          font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: ${PALETTE.pass};
          border: 1px solid ${PALETTE.pass}; border-radius: 4px; padding: 1px 6px; }
        .cluster-members { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
        .cluster-issues { font-size: 12.5px; line-height: 1.5; color: ${PALETTE.ink}; }
        .cluster.concluded { opacity: 0.72; }
        .std-when { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: ${PALETTE.mute}; white-space: nowrap; text-align: right; }
        .std-items { font-size: 12.5px; line-height: 1.5; color: ${PALETTE.ink}; margin: 6px 0 8px; }
        .std-line { font-size: 12.5px; line-height: 1.5; color: ${PALETTE.ink}; margin: 4px 0; }
        .std-tag { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
          color: ${PALETTE.field}; background: ${PALETTE.wheatSoft}; border-radius: 3px; padding: 1px 5px; margin-right: 6px; }
        .feed-item { border: 1px solid ${PALETTE.line}; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: ${PALETTE.paper}; }
        .feed-title { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 14.5px; color: ${PALETTE.ink}; line-height: 1.35; }
        .feed-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; color: ${PALETTE.mute}; }
        .feed-country { font-weight: 600; color: ${PALETTE.field}; }
        .feed-sectors { font-style: italic; }
        .feed-link { display: inline-block; font-size: 12.5px; color: ${PALETTE.field}; margin-bottom: 8px; }
        .feed-actions { display: flex; gap: 8px; }
        .rep-row { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
        .rep-name { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
          color: ${PALETTE.field}; width: 72px; flex-shrink: 0; }
        .rep-bar-wrap { flex: 1; height: 8px; background: ${PALETTE.wheatSoft}; border-radius: 4px; overflow: hidden; }
        .rep-bar { display: block; height: 100%; background: ${PALETTE.wheat}; border-radius: 4px; }
        .rep-n { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: ${PALETTE.mute};
          width: 20px; text-align: right; }
        .inp { width: 100%; font-family: 'Archivo', sans-serif; font-size: 14px; color: ${PALETTE.ink};
          background: ${PALETTE.paper}; border: 1px solid ${PALETTE.line}; border-radius: 8px; padding: 10px 12px; }
        .inp:focus { outline: 2px solid ${PALETTE.wheat}; outline-offset: 1px; border-color: ${PALETTE.wheat}; }
        .ta { resize: vertical; line-height: 1.45; }
        .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 600; padding: 6px 10px;
          border-radius: 99px; border: 1px solid ${PALETTE.line}; background: ${PALETTE.paper};
          color: ${PALETTE.mute}; cursor: pointer; }
        .chip-on { background: ${PALETTE.field}; color: #fff; border-color: ${PALETTE.field}; }
        .gate { padding: 12px 0; border-top: 1px dashed ${PALETTE.line}; }
        .gate-q { font-size: 13px; line-height: 1.45; margin-bottom: 8px; }
        .gate-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .gate-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
          letter-spacing: .06em; text-transform: uppercase; padding: 7px 12px; border-radius: 6px;
          border: 1.5px solid ${PALETTE.line}; background: transparent; color: ${PALETTE.mute}; cursor: pointer; }
        .gate-on { background: transparent; }
        .num-btn { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
          width: 40px; height: 36px; border-radius: 6px; border: 1.5px solid ${PALETTE.line};
          background: transparent; color: ${PALETTE.mute}; cursor: pointer; }
        .num-on { border-color: ${PALETTE.wheat}; color: ${PALETTE.ink}; background: ${PALETTE.wheatSoft}; }
        .stamp { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-weight: 600;
          letter-spacing: .12em; border: 2px solid; border-radius: 4px; padding: 3px 8px;
          transform: rotate(-2deg); white-space: nowrap; }
        .big-stamp { font-size: 11px; }
        .axis { padding: 10px 0; border-top: 1px dashed ${PALETTE.line}; }
        .axis-l { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        .axis-hint { font-weight: 400; color: ${PALETTE.mute}; }
        .score-total { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: ${PALETTE.field}; }
        .score-den { font-size: 12px; color: ${PALETTE.mute}; }
        .link-del { background: none; border: none; color: ${PALETTE.fail}; font-size: 12px;
          font-family: 'IBM Plex Mono', monospace; cursor: pointer; padding: 0; }
        .empty { color: ${PALETTE.mute}; font-size: 14px; padding: 18px; border: 1px dashed ${PALETTE.line};
          border-radius: 10px; text-align: center; }
        .member-hint { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: ${PALETTE.field};
          margin-top: 8px; line-height: 1.5; }
        .breadth-none { font-size: 12px; color: ${PALETTE.mute}; font-style: italic; padding: 4px 0; line-height: 1.45; }
        .breadth-read { display: flex; align-items: baseline; gap: 12px; padding: 2px 0; flex-wrap: wrap; }
        .breadth-score { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: ${PALETTE.field}; }
        .breadth-detail { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: ${PALETTE.mute}; }
        .mem-short { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: ${PALETTE.wheat}; white-space: nowrap; }
        .mem-sectors { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .mem-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
          background: ${PALETTE.wheatSoft}; color: ${PALETTE.unsure}; border-radius: 4px; padding: 3px 7px; }
        .mem-interests { font-size: 13px; line-height: 1.5; color: ${PALETTE.ink}; }
        .thread { font-size: 13px; line-height: 1.5; padding: 8px 0; border-top: 1px dashed ${PALETTE.line}; }
        .thread:first-of-type { border-top: none; padding-top: 0; }
        @media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }
      `}</style>
      {viewMap[view]}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FAEAWorkspace />);
</script>
</body>
</html>
